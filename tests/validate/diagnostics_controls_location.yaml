# Fixture: core + diagnostics + controls + location must validate with no duplicate ids. wifi is
# imported because google_location declares DEPENDENCIES = ["wifi"], and criotive_mqtt (with the
# ciotcfg it reads its broker from) because it owns the google_location sensor location's button
# presses — not as extra scope.
substitutions:
  device_name: diag-ctl-loc-testdev
  firmware_version: "0.0.0-test"
  wifi_ssid: test-ssid
  wifi_password: test-wifi-password

esp32:
  board: esp32dev
  framework:
    type: esp-idf

packages:
  criotive:
    url: https://github.com/criotive/esphome-sdk
    ref: __SDK_REF__
    files:
      - path: modules/core.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/wifi.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/criotive_mqtt.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/ciotcfg.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/diagnostics.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/controls.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/location.yaml
        vars: {sdk_ref: __SDK_REF__}
