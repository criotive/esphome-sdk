# The CAN-room case: the serial API on slot 1's audio pair while CAN keeps GPIO2/GPIO3 and SW1 keeps
# GPIO1, so the pin-conflict rule must not fire. Slot pins are referenced by name, so a board-revision
# pin change follows automatically.
substitutions:
  device_name: serial-api-slot-testdev
  firmware_version: "0.0.0-test"
  wifi_ssid: test-ssid
  wifi_password: test-wifi-password
  serial_api_tx_pin: "${slot_1_audio_tx_dat}"
  serial_api_rx_pin: "${slot_1_audio_rx}"

canbus:
  - platform: esp32_can
    tx_pin: ${can_tx}
    rx_pin: ${can_rx}
    can_id: 1
    bit_rate: 50kbps

packages:
  criotive:
    url: https://github.com/criotive/esphome-sdk
    ref: __SDK_REF__
    files:
      - path: hardware/hds_v1_1.yaml
      - path: modules/core.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/ciotcfg.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/wifi.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/criotive_mqtt.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/ota.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/controls.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/serial_api.yaml
        vars: {sdk_ref: __SDK_REF__}
