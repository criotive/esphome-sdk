# Negative: serial TX on GPIO1 while SW1, a gpio binary_sensor, still holds it. check-serial-api-pins.sh
# asserts the error names hds_v1_1_sw1_enabled. Sourced locally so validation reaches FINAL_VALIDATE
# without a git fetch.
esphome:
  name: ser-sw1-conflict
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
  baud_rate: 0  # free UART0/GPIO1 as an SDK room does

external_components:
  - source:
      type: local
      path: ../../components
    components: [serial_api]

uart:
  - id: serial_api_uart
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 115200

serial_api:
  uart_id: serial_api_uart

binary_sensor:
  - platform: gpio
    pin: 1
    name: "SW1"
