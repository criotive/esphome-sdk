substitutions:
  ota_attempts: "50"
  # Empty removes the native ESPHome OTA port (3232) instead of opening it: an
  # esphome OTA with no password lets anyone on the LAN flash the device, and
  # through it read the ciotcfg partition's broker credentials. The platform's
  # own update route is the MQTT `ota` command below, which needs no port.
  ota_password: ""
  # ESPHome defaults to 4.5s, which also bounds the blocking
  # esp_http_client_open()/fetch_headers() before the download loop -- where an
  # OTA over a weak TLS link dies, after publishing "OTA start".
  ota_http_timeout: 15s

safe_mode:
  num_attempts: ${ota_attempts}
  # Must exceed the 300s rollback watchdog.
  boot_is_good_after: 330s
  # ESPHome 2026.8+ defaults to true, which confirms the running image on any orderly restart: a
  # restart button, SW1 or a factory reset would then keep an image that never reached the broker.
  # Only the MQTT connection (criotive_mqtt on_connect) may confirm it.
  boot_is_good_on_shutdown: false
  # Safe mode can do nothing for this SDK: MQTT and ciotcfg are set up after it, and the native OTA
  # port is closed. So a boot loop -- num_attempts boots in a row that die before boot_is_good_after
  # -- boots the other app slot instead, but only if that image was confirmed once (reached the
  # broker). A slot that is empty, pending or rolled back is left alone, and the device waits out
  # reboot_timeout as ESPHome would. esp_ota_set_boot_partition verifies the image first.
  on_safe_mode:
    - lambda: |-
        const esp_partition_t *running = esp_ota_get_running_partition();
        const esp_partition_t *other = esp_ota_get_next_update_partition(nullptr);
        esp_ota_img_states_t state;
        if (other == nullptr || other == running ||
            esp_ota_get_state_partition(other, &state) != ESP_OK || state != ESP_OTA_IMG_VALID) {
          ESP_LOGW("ota", "Boot loop, and no confirmed image in the other slot to fall back to");
          return;
        }
        esp_err_t err = esp_ota_set_boot_partition(other);
        if (err != ESP_OK) {
          ESP_LOGE("ota", "Boot loop: cannot boot the previous image: %s", esp_err_to_name(err));
          return;
        }
        ESP_LOGW("ota", "Boot loop: booting the previous confirmed image at 0x%" PRIX32, other->address);
        App.reboot();

external_components:
  - source:
      type: git
      url: https://github.com/criotive/esphome-sdk
      ref: ${sdk_ref}
    components: [sdk_boot, ack_button]

esp32:
  framework:
    sdkconfig_options:
      # Stamps firmware_version into the image header (esp_app_desc_t), which is where System Rollback
      # reads the version the other slot holds. Without it ESPHome writes its own release there.
      CONFIG_APP_PROJECT_VER_FROM_CONFIG: "y"
      CONFIG_APP_PROJECT_VER: '"${firmware_version}"'

# Armed from `sdk_boot`, not `esphome: on_boot`: a device config's mapping-form
# `on_boot` replaces that list, and a fresh image would then run unguarded.
sdk_boot:
  - priority: 600
    then:
      - script.execute: script_rollback
  - priority: -100
    then:
      - script.execute: script_rollback_target

logger:
  logs:
    # The platform's OTA url carries a single-use ticket in its query string,
    # and the platform ingests what a device logs. ESPHome 2026.9.1 prints a
    # failing request's full url under `http_request` (http_request_idf.cpp:221
    # at ERROR) and the OTA url under
    # `http_request.ota` at INFO (ota_http_request.cpp:95). A tag may not be
    # more verbose than the global level, so http_request.ota follows
    # logger_level down to WARN and never past it.
    http_request: NONE
    http_request.ota: "${ logger_level | upper if logger_level | upper in ['NONE', 'ERROR', 'WARN'] else 'WARN' }"

ota:
  - platform: esphome
    id: ota_esphome
    password: ${ota_password}
  - id: !remove '${"ota_esphome" if not ota_password else false}'

  - platform: http_request
    on_begin:
      - lambda: 'id(ota_wrote_other_slot) = false;'
      - text_sensor.template.publish:
          id: ota_status
          state: "OTA start"
    on_progress:
      - lambda: |-
          id(ota_wrote_other_slot) = true;
          char buffer[50];
          snprintf(buffer, sizeof(buffer), "OTA progress %0.1f%%", x);
          id(ota_status).publish_state(buffer);
    on_end:
      - text_sensor.template.publish:
          id: ota_status
          state: "OTA end"
      - delay: 1s # Allow MQTT to publish status.
    on_error:
      # The serial and MQTT logs no longer carry http_request's own reason, so
      # the status names the failure. Codes from ESPHome 2026.9.1:
      # ota_http_request.h (0x10-0x12) and ota/ota_backend.h (0x80-0x94).
      - lambda: |-
          const char *reason;
          switch (x) {
            case 0x10: reason = "md5 is not 32 lowercase hex digits"; break;
            case 0x11: reason = "url is not http(s)"; break;
            case 0x12: reason = "download failed: no connection, TLS verification, HTTP error status or read error"; break;
            case 0x80: reason = "the file is not a firmware image"; break;
            case 0x89: reason = "image does not fit the app partition"; break;
            case 0x8B: reason = "image does not match the md5"; break;
            default: reason = "update rejected by the OTA backend"; break;
          }
          char buffer[112];
          snprintf(buffer, sizeof(buffer), "OTA update error %d: %s", x, reason);
          id(ota_status).publish_state(buffer);
      # Once the update has written into the other slot, the image that was there is gone and what
      # replaced it was rejected, yet the bootloader's record may still call the slot confirmed (an md5
      # mismatch leaves a complete image). Erasing its header keeps System Rollback and the boot-loop
      # fallback from ever booting it. Progress only fires after the first write, so a refused or
      # unreachable download leaves the previous image, and the rollback target, untouched.
      - lambda: |-
          if (id(ota_wrote_other_slot)) {
            esp_partition_erase_range(esp_ota_get_next_update_partition(nullptr), 0, 4096);
          }
      - script.execute: script_rollback_target

http_request:
  # The url's ticket is the only credential on the download, so the server must be authenticated.
  # ESP-IDF verifies against its built-in CA bundle.
  verify_ssl: true
  timeout: ${ota_http_timeout}
  # No `watchdog_timeout:` -- do not add one. WatchdogManager *assigns* it for
  # the request (no max against the current value), so against the boards' own
  # `esp32: watchdog_timeout: 60s` any value here narrows the watchdog instead
  # of widening it. Unset keeps the 60s: the option has no default.

globals:
  - id: ota_wrote_other_slot
    type: bool
    initial_value: "false"

text_sensor:
  - platform: template
    name: "OTA status"
    id: ota_status
    update_interval: never
  # The version System Rollback would boot, empty when there is none. Named "System ..." so it
  # publishes under the system_ prefix that marks device system controls (see controls.yaml).
  - platform: template
    name: "System Rollback Target"
    id: rollback_target
    update_interval: never

button:
  # Boots the image in the other app slot. The target is checked again on every press, so a stale
  # value on the broker can never make the device boot an image that is not a valid target.
  - platform: ack_button
    name: "System Rollback"
    on_press:
      - then:
          - script.execute: script_rollback_target
          - script.wait: script_rollback_target
          - if:
              condition:
                lambda: 'return id(rollback_target).state.empty();'
              then:
                - text_sensor.template.publish:
                    id: ota_status
                    state: "Rollback refused: no previous firmware to go back to"
              else:
                - text_sensor.template.publish:
                    id: ota_status
                    state: !lambda 'return "Rollback to " + id(rollback_target).state;'
                # Lets the acknowledgement and the status reach the socket before the reboot.
                - delay: 1s
                - lambda: |-
                    esp_err_t err = esp_ota_set_boot_partition(esp_ota_get_next_update_partition(nullptr));
                    if (err != ESP_OK) {
                      id(ota_status).publish_state(std::string("Rollback failed: ") + esp_err_to_name(err));
                      return;
                    }
                    App.safe_reboot();

script:
  # The platform's OTA route. criotive_mqtt dispatches the command that carries
  # these, the same direction its on_connect already reaches in here for
  # script_rollback: the mqtt module owns the subscription, this one owns what
  # an update does. Everything needed to fetch and verify the image arrives at
  # runtime, which is what lets one build serve a fleet.
  - id: script_ota_from_command
    parameters:
      url: string
      md5: string
    then:
      # Checked here because ESPHome rejects a non-http(s) url by clearing it,
      # and flash() then returns before on_error: the update would fail with no
      # status at all. Codes are ESPHome's own 0x10 and 0x11.
      - if:
          condition:
            lambda: |-
              return (url.rfind("http://", 0) == 0 || url.rfind("https://", 0) == 0) &&
                     md5.size() == 32 &&
                     md5.find_first_not_of("0123456789abcdef") == std::string::npos;
          then:
            - delay: 1s # Allow MQTT to publish status before the flash blocks the loop.
            # No username/password. The url carries its own ticket, and the platform
            # answers it with a redirect to blob storage: ESP-IDF 5.5.1 re-sends an
            # Authorization header across that redirect, and the storage service
            # rejects any request that has one. The url therefore reaches no log --
            # see `logger: logs:` above.
            - ota.http_request.flash:
                url: !lambda 'return url;'
                md5: !lambda 'return md5;'
          else:
            - text_sensor.template.publish:
                id: ota_status
                state: !lambda |-
                  if (url.rfind("http://", 0) != 0 && url.rfind("https://", 0) != 0)
                    return std::string("OTA update error 17: url is not http(s)");
                  return std::string("OTA update error 16: md5 is not 32 lowercase hex digits");

  # The other slot is a target when the bootloader recorded it as confirmed, or when it is ota_0
  # holding the USB-flashed image that installed the running one: the bootloader boots ota_0 with no
  # record, so that image never gets one. Running from ota_0 without a record, the other slot is
  # whatever a previous life left there, and is never offered. esp_partition_get_sha256 verifies the
  # whole image, so a slot an interrupted update overwrote is never offered either.
  - id: script_rollback_target
    then:
      - lambda: |-
          const esp_partition_t *running = esp_ota_get_running_partition();
          const esp_partition_t *other = esp_ota_get_next_update_partition(nullptr);
          std::string target;
          if (other != nullptr && other != running) {
            esp_ota_img_states_t state;
            esp_err_t record = esp_ota_get_state_partition(other, &state);
            bool confirmed = record == ESP_OK && state == ESP_OTA_IMG_VALID;
            bool flashed_by_usb = record == ESP_ERR_NOT_FOUND &&
                                  other->subtype == ESP_PARTITION_SUBTYPE_APP_OTA_0 &&
                                  esp_ota_get_state_partition(running, &state) == ESP_OK;
            uint8_t sha[32];
            esp_app_desc_t desc;
            if ((confirmed || flashed_by_usb) && esp_partition_get_sha256(other, sha) == ESP_OK &&
                esp_ota_get_partition_description(other, &desc) == ESP_OK) {
              target = desc.version[0] != '\0' ? desc.version : "?";
            }
          }
          id(rollback_target).publish_state(target);

  - id: script_rollback
    then:
      - delay: 300s
      - lambda: |-
          #ifdef USE_ESP_IDF
            // Never roll back a confirmed image during an outage.
            const esp_partition_t *running = esp_ota_get_running_partition();
            esp_ota_img_states_t ota_state;
            if (esp_ota_get_state_partition(running, &ota_state) == ESP_OK &&
                ota_state == ESP_OTA_IMG_PENDING_VERIFY) {
              esp_ota_mark_app_invalid_rollback_and_reboot();
            }
          #endif
