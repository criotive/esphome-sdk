name: release-gate

# Compile, then release — in that order, in ONE workflow, so the second cannot happen without the
# first. The compile fans out in shards of fixtures; `needs` treats the matrix as a unit, so the
# release job is unreachable unless every selected fixture built. The release PR's merge selects
# EVERY fixture (it changes version.txt), and the publish step refuses a commit that was not.
#
# The ordering is the whole point. A tag here is permanent, public and pinned by devices in the
# field, so the compile has to run while the version is still only a proposal. Two independent
# workflows could not give that: release-please would create the tag on the release PR's merge
# regardless of whether the compile of that same commit had passed, or even finished. As one
# workflow with `needs: compile`, the release job is simply never reached unless the tree being
# tagged compiled — including on the release PR's own merge commit, which is the commit that gets
# tagged.
#
# This is why there is no `paths:` filter. A release PR only edits CHANGELOG.md and version.txt,
# so a filter would skip the compile on exactly the push that publishes the tag. Any other push
# compiles only the fixtures it can break (scripts/select-fixtures.sh).
#
# `push: branches: [main]` is the ONLY trigger. A workflow_dispatch could be launched from a feature
# branch, where checkout would compile that branch while release-please — which targets the default
# branch unless told otherwise — released main: a release of a tree that was never compiled.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ESPHOME_VERSION: "2026.9.1"

# Deliberately NO `concurrency:` group. Within a group GitHub keeps only the newest PENDING run and
# cancels older ones, even with cancel-in-progress: false — so a burst of pushes could cancel the
# pending run for the release PR's merge commit and silently skip that release. Every push to main
# gets its own run instead.

jobs:
  # The fixture list is DISCOVERED, never hardcoded. A push that changes version.txt or the
  # release manifest — the release PR's merge — or whose parent cannot be diffed compiles EVERY
  # fixture, and an empty list there is a hard error: a skipped compile must never reach a tag.
  # Any other push compiles the fixtures it can break, possibly none.
  discover:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
      full: ${{ steps.list.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        run: |
          set -euo pipefail
          bash scripts/select-fixtures.sh --self-test
          before="${{ github.event.before }}"
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null \
             || git diff --name-only "${before}" "${{ github.sha }}" \
                  | grep -qxE 'version\.txt|\.release-please-manifest\.json'; then
            full=true
            bash scripts/select-fixtures.sh --all >selected.txt
            if [ ! -s selected.txt ]; then
              echo "::error::no validate fixtures found — refusing to let a release proceed uncompiled"
              exit 1
            fi
          else
            full=false
            bash scripts/select-fixtures.sh "${before}" "${{ github.sha }}" >selected.txt
          fi
          echo "full=${full}; selected $(grep -c . selected.txt || true) fixture(s):"
          cat selected.txt
          shards="$(jq -R -s -c 'split("\n") | map(select(length > 0)) as $f
                      | [range(0; $f | length; 8) as $i | $f[$i:$i + 8] | join(" ")]' selected.txt)"
          echo "full=${full}" >>"$GITHUB_OUTPUT"
          echo "shards=${shards}" >>"$GITHUB_OUTPUT"

  # Shards of up to eight fixtures share one toolchain restore and one compiler cache, which costs
  # far fewer runner minutes than a job per fixture. fail-fast: false so every shard reports.
  compile:
    needs: discover
    if: needs.discover.outputs.shards != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixtures: ${{ fromJSON(needs.discover.outputs.shards) }}
    name: compile (${{ matrix.fixtures }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ESPHome compiles through ccache whenever it is on PATH; the runner image has none.
      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      # Saved here, on main, where every pull request can restore them. The toolchain key pins the
      # ESPHome version, so a bump downloads the matching ESP-IDF once.
      - name: Cache the ESP-IDF toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome/idf
            !~/.cache/esphome/idf/ccache
            ~/.cache/pip
          key: esphome-idf-${{ runner.os }}-${{ env.ESPHOME_VERSION }}

      - name: Cache the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/esphome/idf/ccache
          key: esphome-ccache-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: esphome-ccache-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-

      - name: Install ESPHome ${{ env.ESPHOME_VERSION }}
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Materialize the main SHA into validate fixtures
        run: bash scripts/materialize-sdk-ref.sh "${{ github.sha }}"

      - name: esphome compile
        run: bash scripts/compile-fixtures.sh ${{ matrix.fixtures }}

  # The executable negative harness needs esphome but not a build, so it is its own job rather than
  # something repeated in all N compile legs. Parity only matches names against fixture FILENAMES;
  # this actually runs them, proving each required substitution still fails validation when omitted.
  negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome ${{ env.ESPHOME_VERSION }}
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Negative-fixture gate (required substitutions must fail validation)
        run: |
          bash scripts/check-negative.sh --self-test
          bash scripts/check-negative.sh

  # EVERY gate runs again here, not just the contract one. On a pull request they are enforced by
  # validate.yml, but a direct push to main never has a pull request — and without this job a push
  # that violates offline-survival, rollback timing, ref hygiene or automation syntax would still
  # compile, still pass the contract check, and still be released.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # esphome is needed by the serial-api pin gate below, which runs `esphome config` over the
      # negative fixtures to assert the pin contract fails with the RIGHT error text. The other gates
      # in this job are pure bash and do not use it.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ESPHome ${{ env.ESPHOME_VERSION }}
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Automation list-syntax gate
        run: |
          bash scripts/check-automation-syntax.sh --self-test
          bash scripts/check-automation-syntax.sh

      - name: Button-platform gate (a visible button must be able to acknowledge)
        run: |
          bash scripts/check-button-platform.sh --self-test
          bash scripts/check-button-platform.sh

      - name: SDK ref-consistency gate
        run: |
          bash scripts/check-sdk-ref.sh --self-test
          bash scripts/check-sdk-ref.sh

      - name: Offline-survival gate (reboot_timeout defaults must be 0s)
        run: |
          bash scripts/check-offline-survival.sh --self-test
          bash scripts/check-offline-survival.sh

      - name: OTA rollback-timing gate (safe_mode confirms after the watchdog)
        run: |
          bash scripts/check-rollback-timing.sh --self-test
          bash scripts/check-rollback-timing.sh

      - name: OTA url-only gate (no credentials on the download, no url in the logs)
        run: |
          bash scripts/check-ota-url-only.sh --self-test
          bash scripts/check-ota-url-only.sh

      # The contract gate here compares against the last PUBLISHED tag, reading the commits
      # release-please will actually parse. The pull-request pass cannot stand in for it: it never
      # sees a direct push, and it inspects commits a squash merge could have rewritten.
      - name: Substitution-contract gate since the last release
        run: |
          bash scripts/check-contract-diff.sh --self-test
          bash scripts/check-contract-diff.sh --since-release "${{ github.sha }}"

      - name: Negative-harness parity
        run: bash scripts/check-contract-diff.sh --negative-parity

      - name: Serial API pin-contract gate (required pins + component pin-conflict rule, by error text)
        run: |
          bash scripts/check-serial-api-pins.sh --self-test
          bash scripts/check-serial-api-pins.sh

  release:
    needs: [discover, compile, negative, gates]
    # A compile skipped because the push selected no fixture still maintains the release PR.
    if: >-
      always() && needs.discover.result == 'success' && needs.negative.result == 'success'
      && needs.gates.result == 'success'
      && (needs.compile.result == 'success'
          || (needs.compile.result == 'skipped' && needs.discover.outputs.full != 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # release-please decides what to publish from the repository's state, not from this run's
      # SHA, so two separate things have to be true before it is allowed to create a tag.
      #
      # (1) This run's commit is still main's head. With no concurrency group runs overlap, and a
      #     slow run for an older commit must not act on a main that has moved past it.
      # (2) This commit IS the merge of the release PR. Otherwise release-please would happily
      #     publish a release PR that was merged earlier and never tagged — including one whose own
      #     gates FAILED, which is exactly the commit that must never become a tag.
      #
      # When either is false the action still runs, with releases disabled, so the release PR keeps
      # being maintained. Only the run that verified the precise commit being tagged may publish it.
      - name: Decide whether this run may publish
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/${{ github.repository }}/commits/heads/main" --jq .sha)"
          if [ "$head" != "${{ github.sha }}" ]; then
            echo "main is at ${head}; this run verified ${{ github.sha }} — maintaining the release PR only."
            echo "publish=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          # The merge commit of the most recently merged release-please PR, if any.
          merged="$(gh api "repos/${{ github.repository }}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=50" \
                      --jq '[.[] | select(.head.ref | startswith("release-please--")) | select(.merged_at != null)][0].merge_commit_sha // ""')"
          if [ -n "$merged" ] && [ "$merged" = "${{ github.sha }}" ]; then
            echo "this commit is the release PR merge and passed its gates — publishing."
            echo "publish=true" >>"$GITHUB_OUTPUT"
          else
            echo "this commit is not a release PR merge (pending release merge: '${merged:-none}') — maintaining the release PR only."
            echo "publish=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Refuse to publish a commit that was not fully compiled
        if: steps.guard.outputs.publish == 'true' && needs.discover.outputs.full != 'true'
        run: |
          echo "::error::this is the release merge, but not every fixture was compiled; re-run this workflow"
          exit 1

      - name: Maintain the release PR (no release)
        if: steps.guard.outputs.publish != 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: true

      - name: Publish the release for this verified commit
        if: steps.guard.outputs.publish == 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
