name: validate

# PR fixtures resolve against the head SHA, not a published tag.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request makes this run's results moot.
concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ESPHOME_VERSION: "2026.9.1"
  SDK_REF: ${{ github.event.pull_request.head.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The contract gate diffs the base commit's tree against the head's and reads the commit
          # subjects in between, so it needs real history, not a depth-1 clone.
          fetch-depth: 0

      - name: Automation list-syntax gate
        run: |
          bash scripts/check-automation-syntax.sh --self-test
          bash scripts/check-automation-syntax.sh

      - name: Button-platform gate (a visible button must be able to acknowledge)
        run: |
          bash scripts/check-button-platform.sh --self-test
          bash scripts/check-button-platform.sh

      - name: SDK ref-consistency gate
        run: |
          bash scripts/check-sdk-ref.sh --self-test
          bash scripts/check-sdk-ref.sh

      - name: Offline-survival gate (reboot_timeout defaults must be 0s)
        run: |
          bash scripts/check-offline-survival.sh --self-test
          bash scripts/check-offline-survival.sh

      - name: OTA rollback-timing gate (safe_mode confirms after the watchdog)
        run: |
          bash scripts/check-rollback-timing.sh --self-test
          bash scripts/check-rollback-timing.sh

      - name: OTA url-only gate (no credentials on the download, no url in the logs)
        run: |
          bash scripts/check-ota-url-only.sh --self-test
          bash scripts/check-ota-url-only.sh

      - name: Substitution-contract gate (a breaking change must be declared breaking)
        run: |
          set -euo pipefail
          bash scripts/check-contract-diff.sh --self-test
          # Compare against the MERGE BASE, not the base branch tip. If main moved on after this
          # branch forked, a substitution main added would look like one this PR removed, and the
          # gate would demand a breaking marker for a change the PR never made.
          base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          echo "contract baseline (merge-base): ${base}"
          bash scripts/check-contract-diff.sh "$base" "${{ github.event.pull_request.head.sha }}"

      - name: Negative-harness parity (every required substitution has an omit_ fixture)
        run: bash scripts/check-contract-diff.sh --negative-parity

      - name: Materialize the revision under test into validate fixtures
        run: |
          bash scripts/materialize-sdk-ref.sh --self-test
          bash scripts/materialize-sdk-ref.sh "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome ${{ env.ESPHOME_VERSION }}
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: esphome config over validate fixtures
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/validate/*.yaml tests/validate/*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No validate fixtures yet — scaffold is green with no modules."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "== esphome config $f =="
            esphome config "$f"
          done

      - name: Negative-fixture gate (required substitutions must fail validation)
        run: |
          bash scripts/check-negative.sh --self-test
          bash scripts/check-negative.sh

  # Compiles only the fixtures this pull request can break (scripts/select-fixtures.sh), in shards
  # of eight, so a docs change compiles nothing. The release merge compiles all of them.
  discover:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: list
        run: |
          set -euo pipefail
          bash scripts/select-fixtures.sh --self-test
          bash scripts/select-fixtures.sh "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" >selected.txt
          echo "selected $(grep -c . selected.txt || true) fixture(s):"
          cat selected.txt
          shards="$(jq -R -s -c 'split("\n") | map(select(length > 0)) as $f
                      | [range(0; $f | length; 8) as $i | $f[$i:$i + 8] | join(" ")]' selected.txt)"
          echo "shards=${shards}" >>"$GITHUB_OUTPUT"

  compile:
    needs: discover
    if: needs.discover.outputs.shards != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixtures: ${{ fromJSON(needs.discover.outputs.shards) }}
    name: compile (${{ matrix.fixtures }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ESPHome compiles through ccache whenever it is on PATH; the runner image has none.
      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      # Restore only: main's release-gate saves these, and pull requests can read main's caches.
      - name: Restore the ESP-IDF toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/esphome/idf
            !~/.cache/esphome/idf/ccache
            ~/.cache/pip
          key: esphome-idf-${{ runner.os }}-${{ env.ESPHOME_VERSION }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/esphome/idf/ccache
          key: esphome-ccache-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-${{ github.run_id }}
          restore-keys: esphome-ccache-${{ runner.os }}-${{ env.ESPHOME_VERSION }}-

      - name: Install ESPHome ${{ env.ESPHOME_VERSION }}
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Materialize the revision under test into validate fixtures
        run: bash scripts/materialize-sdk-ref.sh "${{ github.event.pull_request.head.sha }}"

      - name: esphome compile
        run: bash scripts/compile-fixtures.sh ${{ matrix.fixtures }}

  # Host unit tests for the Serial API wire protocol: plain g++ driven from Python, no ESPHome.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Serial API protocol unit tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
